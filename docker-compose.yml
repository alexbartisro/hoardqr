services:
  hoardqr:
    build: .
    container_name: hoardqr
    command: ["serve"]
    restart: unless-stopped
    environment:
      # sslmode=disable is required, not cosmetic — and NOT a "we turned off
      # security" choice, despite how it reads. hoardqr-db (postgres:16-alpine)
      # simply has no SSL configured (no certs, no ssl=on) — normal for a
      # container reachable only over this private Compose network, never the
      # public internet. Every other Postgres client (psql, psycopg2, JDBC —
      # anything linking real libpq) defaults to sslmode=prefer against a
      # server like that: try SSL, silently fall back to plaintext, connect
      # fine, no config needed. Go's lib/pq is the outlier — its own docs
      # (doc.go) admit its default is "require", which is NOT libpq's
      # default, and it fails outright instead of falling back:
      # "pq: SSL is not enabled on the server". golang-migrate's postgres
      # driver (used once at startup by db.Migrate, not by the app's own
      # connection pool — that's pgx, which does default to "prefer" like
      # everything else) pulls in lib/pq, so it's the one thing here that
      # actually needs sslmode spelled out explicitly. Without this,
      # `docker logs -f` shows "database connected" (pgx succeeding)
      # immediately followed by "running migrations" failing, forever, on
      # every restart — a real outage this project hit once already.
      DATABASE_URL: postgres://hoardqr:${DB_PASSWORD}@hoardqr-db:5432/hoardqr?sslmode=disable
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      SESSION_SECRET: ${SESSION_SECRET}
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/data/uploads
    depends_on:
      hoardqr-db:
        condition: service_healthy

  hoardqr-mcp:
    build: .
    container_name: hoardqr-mcp
    command: ["mcp"]
    restart: unless-stopped
    environment:
      # See the hoardqr service's DATABASE_URL comment above — same fix,
      # same reason (this run mode also calls db.Migrate at startup).
      DATABASE_URL: postgres://hoardqr:${DB_PASSWORD}@hoardqr-db:5432/hoardqr?sslmode=disable
      MCP_API_TOKEN: ${MCP_API_TOKEN}
    ports:
      - "8081:8081"
    depends_on:
      hoardqr-db:
        condition: service_healthy

  hoardqr-db:
    image: postgres:16-alpine
    container_name: hoardqr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hoardqr
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: hoardqr
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoardqr"]
      interval: 5s
      timeout: 5s
      retries: 10
