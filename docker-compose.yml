services:
  hoardqr:
    build: .
    container_name: hoardqr
    command: ["serve"]
    restart: unless-stopped
    environment:
      # sslmode=disable is required, not cosmetic: the bundled hoardqr-db
      # image has no SSL configured, and while pgx (the app's own pool)
      # defaults to "prefer" and falls back to plaintext on its own,
      # golang-migrate's postgres driver goes through lib/pq, whose default
      # is "require" — it fails outright with "pq: SSL is not enabled on
      # the server" instead of falling back. Without this, `docker logs -f`
      # shows "database connected" (pgx succeeding) immediately followed by
      # "running migrations" failing, forever, on every restart attempt.
      DATABASE_URL: postgres://hoardqr:${DB_PASSWORD}@hoardqr-db:5432/hoardqr?sslmode=disable
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      SESSION_SECRET: ${SESSION_SECRET}
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/data/uploads
    depends_on:
      hoardqr-db:
        condition: service_healthy

  hoardqr-mcp:
    build: .
    container_name: hoardqr-mcp
    command: ["mcp"]
    restart: unless-stopped
    environment:
      # See the hoardqr service's DATABASE_URL comment above — same fix,
      # same reason (this run mode also calls db.Migrate at startup).
      DATABASE_URL: postgres://hoardqr:${DB_PASSWORD}@hoardqr-db:5432/hoardqr?sslmode=disable
      MCP_API_TOKEN: ${MCP_API_TOKEN}
    ports:
      - "8081:8081"
    depends_on:
      hoardqr-db:
        condition: service_healthy

  hoardqr-db:
    image: postgres:16-alpine
    container_name: hoardqr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hoardqr
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: hoardqr
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoardqr"]
      interval: 5s
      timeout: 5s
      retries: 10
